name: Sincronizar Drive

# Trae los CSV mensuales de la carpeta de Drive (uno por mes, informe de campana
# de Google Ads), actualiza data/ y republica el tablero si algo cambio.
# Corre todos los dias a las 11:20 UTC (06:20 en Lima) y a mano desde
# Actions > Sincronizar Drive > Run workflow.
on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # El script usa solo la biblioteca estandar: el Python del runner alcanza.
      # Sin AQ_DRIVE_API_KEY lee la carpeta por su vista publica, que no pide credenciales.
      - name: Sincronizar con Drive
        id: sync
        env:
          AQ_DRIVE_API_KEY: ${{ secrets.AQ_DRIVE_API_KEY }}
        run: python3 scripts/sync-drive.py

      - name: Guardar los datos nuevos
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "aquarius-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sincroniza el gasto publicitario desde Drive"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, asi que la
      # publicacion se pide a mano.
      - name: Publicar el tablero
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Sin novedades
        if: steps.sync.outputs.changed != 'true'
        run: echo "La carpeta de Drive no trajo datos nuevos; el tablero sigue igual."
