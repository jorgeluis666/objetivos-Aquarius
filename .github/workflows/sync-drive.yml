name: Sincronizar Drive

# Trae los informes mensuales de Google Ads desde Drive, actualiza data/ y
# republica el tablero si algo cambio:
# - carpeta "Google files - Aquarius": una hoja (o CSV) por mes con el informe de campana
#   (Gasto Publicitario y Proyecciones);
# - carpeta "Google Ads Aquarius Keywords": una hoja por mes con el informe de
#   palabras clave (Analisis de Palabras Clave).
# Corre todos los dias a las 10:00 de Lima: lo lanza un activador de Google Apps
# Script (scripts/apps-script/sincronizar-aquarius.gs) por workflow_dispatch, que
# arranca al momento. El cron de las 15:00 UTC (10:00 en Lima) queda de respaldo:
# GitHub atrasa varias horas los workflows programados. Tambien a mano desde
# Actions > Sincronizar Drive > Run workflow.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # El script usa solo la biblioteca estandar: el Python del runner alcanza.
      # Sin AQ_DRIVE_API_KEY lee la carpeta por su vista publica, que no pide credenciales.
      - name: Sincronizar con Drive
        id: sync
        env:
          AQ_DRIVE_API_KEY: ${{ secrets.AQ_DRIVE_API_KEY }}
        run: python3 scripts/sync-drive.py

      # Corre aunque falle el paso anterior: una carpeta no frena a la otra.
      - name: Sincronizar palabras clave
        id: keywords
        if: ${{ !cancelled() }}
        env:
          AQ_DRIVE_API_KEY: ${{ secrets.AQ_DRIVE_API_KEY }}
        run: python3 scripts/sync-keywords.py

      - name: Guardar los datos nuevos
        if: ${{ !cancelled() && (steps.sync.outputs.changed == 'true' || steps.keywords.outputs.changed == 'true') }}
        run: |
          git config user.name "aquarius-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sincroniza los informes de Google Ads desde Drive"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, asi que la
      # publicacion se pide a mano.
      - name: Publicar el tablero
        if: ${{ !cancelled() && (steps.sync.outputs.changed == 'true' || steps.keywords.outputs.changed == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Sin novedades
        if: ${{ !cancelled() && steps.sync.outputs.changed != 'true' && steps.keywords.outputs.changed != 'true' }}
        run: echo "Las carpetas de Drive no trajeron datos nuevos; el tablero sigue igual."
