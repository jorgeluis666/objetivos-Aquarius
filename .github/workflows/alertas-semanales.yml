name: Alerta semanal de Google Ads

# Correo con el estado del mes de Google Ads (scripts/alertas.js), con la estetica del tablero.
on:
  # Todos los lunes a las 6:00 p. m. de Lima (23:00 UTC).
  schedule:
    - cron: '0 23 * * 1'

  # Despues de cada barrido de Drive: solo manda si cambiaron las cifras del mes. El barrido commitea
  # con GITHUB_TOKEN, que no dispara workflows por push, asi que se encadena con workflow_run
  # (que solo se activa en la rama por defecto).
  workflow_run:
    workflows: ["Sincronizar Drive"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulación (no envía email real)'
        type: boolean
        default: true
      reenviar:
        description: 'Reenviar aunque el correo de esta semana ya salió (para pruebas)'
        type: boolean
        default: false

permissions:
  contents: write   # necesario para commitear alertas-envios.json

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alerta:
    # Si viene por workflow_run, solo correr si el barrido termino bien.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # El repo no lleva package-lock.json: se instala solo lo que el envio necesita.
      - name: Instalar nodemailer
        run: npm install nodemailer@6.10.1 --no-save --no-audit --no-fund

      - name: Ejecutar la alerta
        run: node scripts/alertas.js ${{ github.event_name == 'workflow_dispatch' && inputs.reenviar && '--force' || '' }}
        env:
          # lunes: una vez por semana. datos: tras el barrido de Drive, solo si cambiaron las cifras.
          # manual: como el lunes (con "reenviar" se manda igual).
          ALERTA_MOTIVO: ${{ github.event_name == 'schedule' && 'lunes' || github.event_name == 'workflow_run' && 'datos' || 'manual' }}
          # Lista de correos de la ruedita de Notificaciones (Web App alertas-destinatarios.gs).
          AQ_ALERTAS_URL: ${{ secrets.AQ_ALERTAS_URL }}
          AQ_ALERTAS_TOKEN: ${{ secrets.AQ_ALERTAS_TOKEN }}
          # Correo del hosting (alertas@limaretail.com). Si faltan, se usa Resend.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Enlace del correo (variable del repo); si falta se usa el de data/alertas-config.json.
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # En dispatch manual, respeta el input dry_run. En schedule/workflow_run, envía real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      - name: Registrar el envío en el repo
        if: >-
          success() &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas-envios.json
          if git diff --cached --quiet; then
            echo "Sin cambios en alertas-envios.json (no hubo envio)"
          else
            WEEK=$(TZ='America/Lima' date +'%Y-W%V')
            git commit -m "chore: alerta de Google Ads ${WEEK} enviada"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
