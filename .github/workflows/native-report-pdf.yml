name: PDF original para Nexus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core@25.16.0
      - run: python -m pip install --quiet pymupdf==1.26.6
      - name: Verify production download and page three
        env:
          AQ_PAGE_PASSWORD: ${{ secrets.AQ_PAGE_PASSWORD }}
        run: node scripts/verify-production-chart.cjs
