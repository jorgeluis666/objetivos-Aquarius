<!DOCTYPE html>
<!-- Plantilla: scripts/build.js la usa cuando hay AQ_PAGE_PASSWORD (GitHub Pages) y rellena el marcador de
     gate-payload con el tablero cifrado (AES-GCM, llave PBKDF2-SHA256 de la clave). Sin la clave el HTML no revela nada. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aquarius | Acceso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<!-- Mismo diseno y azul que la pantalla de acceso de LR Suite y de los demas tableros de la agencia, con los
     textos de Aquarius; aqui la clave no esta en el codigo: descifra el tablero. -->
<style>
  :root { --accent: #2563eb; --accent-dark: #1d4ed8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; overflow: hidden; background: #0f172a; color: #0f172a; }
  .panel { width: 400px; max-width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    padding: 48px 44px; overflow-y: auto; background: #fff; }
  .inner { width: 100%; max-width: 312px; }
  .brand { margin-bottom: 16px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .title { margin: 0 0 28px; font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; color: #0f172a; }
  .divider { width: 40px; height: 3px; margin-bottom: 36px; border-radius: 2px; background: var(--accent); }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=password] { width: 100%; padding: 12px 16px; border: 1.5px solid #dce3ef; border-radius: 8px; outline: none; background: #e8f0fe;
    color: #0f172a; font: inherit; font-size: 14px; transition: border-color .15s; }
  input[type=password]::placeholder { color: #64748b; }
  input[type=password]:focus { border-color: var(--accent); }
  .remember { display: flex; align-items: center; gap: 8px; color: #475569; font-size: 13px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit;
    font-size: 14px; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 18px; margin-top: 12px; font-size: 12px; color: #dc2626; }
  /* El degradado es la capa de respaldo si la imagen falta o todavia no carga. */
  .bg { flex: 1; min-width: 0; background-color: #0f172a; background-image: linear-gradient(140deg, var(--accent) 0%, var(--accent-dark) 38%, #0f172a 100%);
    background-size: cover; background-position: center; filter: grayscale(20%); }
  @media (max-width: 768px) {
    .panel { width: 100%; padding: 32px 24px; }
    .inner { max-width: 360px; }
    .title { font-size: 30px; margin-bottom: 22px; }
    .divider { margin-bottom: 26px; }
    .bg { display: none; }
  }
  @media (max-height: 520px) {
    .panel { align-items: flex-start; padding: 24px; }
    .title { font-size: 26px; margin-bottom: 18px; }
    .divider { margin-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="inner">
    <div class="brand">Aquarius</div>
    <h1 class="title">Dashboard<br>Retail 2026</h1>
    <div class="divider"></div>
    <form id="gate" autocomplete="off">
      <input type="password" id="gate-password" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <label class="remember"><input type="checkbox" id="gate-remember"> Recordar en este equipo</label>
      <button type="submit" id="gate-submit" disabled>Ingresar</button>
    </form>
    <div class="error" id="gate-error" role="alert"></div>
  </div>
</div>
<div class="bg" id="gate-bg"></div>
<script type="application/json" id="gate-payload">__PAYLOAD__</script>
<script>
// IIFE: document.open() conserva el mismo window, y un const global chocaria con los scripts del tablero.
(function () {
  var payload = JSON.parse(document.getElementById('gate-payload').textContent);
  // La llave (no la clave) se guarda con la sal del build, que es fija por marca (scripts/build.js): con
  // "Recordar en este equipo" queda tambien en localStorage y sirve entre deploys hasta que cambie la clave.
  var storageKey = 'aq-gate-key';
  var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (arr) { return btoa(String.fromCharCode.apply(null, arr)); };

  function derive(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations }, base, 256);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }

  function readSaved() {
    var stores = ['sessionStorage', 'localStorage'];
    for (var i = 0; i < stores.length; i++) {
      try {
        var saved = JSON.parse(window[stores[i]].getItem(storageKey) || 'null');
        if (saved && saved.salt === payload.salt && saved.key) return bytes(saved.key);
      } catch (e) {}
    }
    return null;
  }

  function forget() {
    ['sessionStorage', 'localStorage'].forEach(function (name) {
      try { window[name].removeItem(storageKey); } catch (e) {}
    });
  }

  // persistent: true/false al ingresar con la clave; sin valor (llave ya recordada) no toca localStorage.
  function show(rawKey, persistent) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data)); })
      .then(function (plain) {
        var value = JSON.stringify({ salt: payload.salt, key: toB64(rawKey) });
        try { sessionStorage.setItem(storageKey, value); } catch (e) {}
        if (persistent !== undefined) {
          try {
            if (persistent) localStorage.setItem(storageKey, value);
            else localStorage.removeItem(storageKey);
          } catch (e) {}
        }
        var html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      });
  }

  // El fondo se aplica solo cuando termino de cargar; si falla queda el degradado.
  // Con una llave guardada no se pide: la imagen retrasaria el 'load' que espera la apertura automatica.
  if (!readSaved()) {
    var background = new Image();
    background.onload = function () {
      var bg = document.getElementById('gate-bg');
      if (bg) bg.style.backgroundImage = "url('assets/login-bg.jpg')";
    };
    background.src = 'assets/login-bg.jpg';
  }

  var form = document.getElementById('gate');
  var input = document.getElementById('gate-password');
  var remember = document.getElementById('gate-remember');
  var submit = document.getElementById('gate-submit');
  var error = document.getElementById('gate-error');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!window.crypto || !crypto.subtle) { error.textContent = 'Este navegador no puede abrir el tablero.'; return; }
    submit.disabled = true;
    error.textContent = '';
    derive(input.value).then(function (rawKey) { return show(rawKey, remember.checked); }).catch(function () {
      submit.disabled = false;
      error.textContent = 'Contraseña incorrecta';
      input.select();
    });
  });

  // El boton nace deshabilitado: mientras la pagina sigue bajando el tablero cifrado, Enter no envia el
  // formulario (recargaria la pagina y se perderia lo escrito). Se habilita cuando ya se escucha el submit.
  submit.disabled = false;

  // Con una llave guardada (esta sesion o recordada) se abre solo, pero despues de 'load': si document.open() corre mientras
  // el parser sigue activo no reemplaza la pagina y el tablero se mezcla con este formulario.
  var saved = readSaved();
  if (saved) {
    document.body.style.visibility = 'hidden';
    window.addEventListener('load', function () {
      show(saved).catch(function () {
        forget();
        document.body.style.visibility = '';
      });
    }, { once: true });
  }
})();
</script>
</body>
</html>
